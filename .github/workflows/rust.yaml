name: Flutter desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'
  CARGO_BUILD_JOBS: '4'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: linux
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: linux
          - os: windows-2022
            platform: windows-x86_64
            target: windows
          - os: macos-15
            platform: macos-aarch64
            target: macos
          - os: macos-15-intel
            platform: macos-x86_64
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned stable Flutter
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav xvfb xauth xdg-desktop-portal xdg-desktop-portal-gtk desktop-file-utils appstream
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config gstreamer glib-networking
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite nsis -y --no-progress
          ./scripts/package/windows-sdk.ps1
      - name: Locked Dart dependencies
        working-directory: desktop
        run: flutter pub get --enforce-lockfile
      - name: Rust format, tests and lint
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --exclude orange-app --exclude orange-theme --no-default-features --locked
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- cargo test --workspace --exclude orange-app --exclude orange-theme --all-features --locked
          else
            cargo test --workspace --exclude orange-app --exclude orange-theme --all-features --locked
          fi
          cargo clippy --workspace --exclude orange-app --exclude orange-theme --all-targets --all-features --locked -- -D warnings
      - name: Bridge generation and security audit
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          RUST_LOG=info flutter_rust_bridge_codegen generate
          git diff --exit-code -- crates/orange-bridge/src/frb_generated.rs desktop/lib/bridge
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Database compatibility oracle
        shell: bash
        run: |
          python scripts/compat/make_fixture_db.py "$RUNNER_TEMP/orange-compat.db"
          ORANGE_COMPAT_FIXTURE="$RUNNER_TEMP/orange-compat.db" cargo test -p orange-db --locked
      - name: Dart analysis and real native bridge/widget tests
        shell: bash
        run: |
          cargo build -p orange-bridge --features native --locked
          case "$RUNNER_OS" in
            Linux) export ORANGE_RUST_LIBRARY="$PWD/target/debug/liborange_bridge.so" ;;
            macOS) export ORANGE_RUST_LIBRARY="$PWD/target/debug/liborange_bridge.dylib" ;;
            Windows) export ORANGE_RUST_LIBRARY="$(cygpath -w "$PWD/target/debug/orange_bridge.dll")" ;;
          esac
          cd desktop
          flutter analyze
          if [[ "$RUNNER_OS" == Linux ]]; then dbus-run-session -- flutter test; else flutter test; fi
      - name: Native desktop UI controls
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash scripts/qa/run-flutter-linux.sh
          else
            profile="$RUNNER_TEMP/orange-ui-profile"
            python scripts/qa/prepare.py "$profile"
            export ORANGE_AUDIO_OUTPUT=null
            if [[ "$RUNNER_OS" == Windows ]]; then export ORANGE_PROFILE_DIR="$(cygpath -w "$profile")"; else export ORANGE_PROFILE_DIR="$profile"; fi
            cd desktop
            flutter test integration_test/desktop_test.dart -d '${{ matrix.target }}'
          fi
      - name: Release bundle and packages
        run: python scripts/desktop/build.py --package
      - name: Linux metadata and archive smoke test
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate dist/unix/com.goshapps.Orange.desktop
          appstreamcli validate --no-net dist/unix/com.goshapps.Orange.appdata.xml
          xvfb-run -a dbus-run-session -- python3 scripts/qa/smoke-linux-package.py target/packages/*.tar.gz
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer=Get-ChildItem target/packages/*-setup.exe | Select-Object -First 1
          $process=Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {throw 'Installer failed'}
          & "$env:LOCALAPPDATA/Programs/Orange/orange-cli.exe" --version
          $process=Start-Process "$env:LOCALAPPDATA/Programs/Orange/Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {throw 'Uninstaller failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: orange-${{ matrix.platform }}
          path: |
            target/packages/*.zip
            target/packages/*.dmg
            target/packages/*.exe
            target/packages/*.tar.gz
            target/packages/*.sha256
          if-no-files-found: error
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SDK and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus-x11 python3-venv
          version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Offline input preparation and manifest
        run: |
          python3 scripts/flatpak/prepare_flutter.py
          python3 scripts/compat/check_manifest.py data/com.goshapps.Orange.yml
      - name: Sandbox build, install and command smoke test
        run: |
          flatpak-builder --user --install --force-clean --arch=${{ matrix.arch }} --repo=flatpak-repo flatpak-build data/com.goshapps.Orange.yml
          flatpak run --command=orange-cli com.goshapps.Orange --version
          flatpak run --command=orange-cli com.goshapps.Orange --headless
      - name: Sandbox GUI launch
        run: |
          xvfb-run -a dbus-run-session -- bash -c 'flatpak run com.goshapps.Orange > /tmp/orange-flatpak.log 2>&1 & app_pid=$!; sleep 15; kill -0 "$app_pid"; kill "$app_pid"; wait "$app_pid" || test "$?" = 143'
          cat /tmp/orange-flatpak.log
      - name: Bundle and checksum
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          file="orange-$version-${{ matrix.arch }}.flatpak"
          flatpak build-bundle flatpak-repo "$file" com.goshapps.Orange
          sha256sum "$file" > "$file.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: orange-flatpak-${{ matrix.arch }}
          path: '*.flatpak*'
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify complete target artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          for expected in windows-x86_64.zip windows-x86_64-setup.exe macos-arm64.dmg macos-x86_64.dmg linux-x86_64.tar.gz linux-aarch64.tar.gz x86_64.flatpak aarch64.flatpak; do
            test -f "artifacts/orange-$version-$expected"
          done
          (cd artifacts && sha256sum -c *.sha256)
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          cat > "$RUNNER_TEMP/orange-release.md" <<'NOTES'
          Orange Flutter migration preview. Core library/queue/playlist workflows use a Rust backend.

          Advanced account and hardware workflows remain parity gates. Physical audio, native dialogs and persistent portal grants, DPI/accessibility and manual platform certification are described in PLATFORM_SUPPORT.md and MIGRATION_AUDIT.md. This release must not be presented as a production-complete rewrite.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/orange-release.md" "${prerelease[@]}" artifacts/*
