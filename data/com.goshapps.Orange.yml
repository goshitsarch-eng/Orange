# Flutter desktop embedding; GTK is the native host, not the application UI.
app-id: com.goshapps.Orange
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: orange
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-music:ro
  - --own-name=org.mpris.MediaPlayer2.orange
  - --talk-name=org.freedesktop.Notifications
  - --env=GTK_USE_PORTAL=1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_NET_OFFLINE: "true"
    CARGO_HOME: /run/build/orange/cargo
    PUB_CACHE: /run/build/orange/pub-cache
    FLUTTER_SUPPRESS_ANALYTICS: "true"
    DASH__SUPPRESS_ANALYTICS: "true"
    XDG_CONFIG_HOME: /run/build/orange/.config
    XDG_CACHE_HOME: /run/build/orange/.cache
modules:
  - name: orange
    buildsystem: simple
    build-commands:
      - pkg-config --exists gtk+-3.0 gstreamer-1.0 gstreamer-audio-1.0 gstreamer-app-1.0
      # Require real base/good/bad/ugly/libav encoders rather than silently
      # claim full conversion coverage with a partial runtime.
      - for e in lamemp3enc flacenc vorbisenc opusenc speexenc wavpackenc avenc_wmav2 avmux_asf mp4mux; do gst-inspect-1.0 "$e" >/dev/null || exit 1; done
      - gst-inspect-1.0 fdkaacenc >/dev/null || gst-inspect-1.0 avenc_aac >/dev/null
      - git -C flutter config --local safe.directory /run/build/orange/flutter
      - export PATH="$PWD/flutter/bin:$PATH"; cd desktop; flutter pub get --offline --enforce-lockfile; flutter build linux --release --no-pub
      - install -d /app/lib/orange /app/bin
      - cp -a desktop/build/linux/*/release/bundle/. /app/lib/orange/
      - ln -s /app/lib/orange/orange /app/bin/orange
      - ln -s /app/lib/orange/orange-cli /app/bin/orange-cli
      - install -Dm644 data/icons/scalable/com.goshapps.Orange.svg /app/share/icons/hicolor/scalable/apps/com.goshapps.Orange.svg
      - install -Dm644 data/icons/128x128/com.goshapps.Orange.png /app/share/icons/hicolor/128x128/apps/com.goshapps.Orange.png
      - install -Dm644 dist/unix/com.goshapps.Orange.desktop /app/share/applications/com.goshapps.Orange.desktop
      - install -Dm644 dist/unix/com.goshapps.Orange.appdata.xml /app/share/metainfo/com.goshapps.Orange.appdata.xml
      - install -Dm644 COPYING /app/share/licenses/orange/COPYING
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - .flatpak-input
          - desktop/build
          - desktop/.dart_tool
          - .flatpak-builder
          - build-x64
          - build-arm64
          - repo-x64
          - repo-arm64
      - type: dir
        path: ../.flatpak-input/flutter
        dest: flutter
      - type: dir
        path: ../.flatpak-input/pub-cache
        dest: pub-cache
      - cargo-sources.json
