[package]
name = "orange-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
description = "Orange cross-platform Rust and Dioxus Desktop music player"

[[bin]]
name = "orange"
path = "src/main.rs"

[lib]
name = "orange_app"
path = "src/lib.rs"

[dependencies]
orange-core = { version = "3.1.0-alpha.1", path = "../orange-core" }
orange-db = { version = "3.1.0-alpha.1", path = "../orange-db" }
orange-collection = { version = "3.1.0-alpha.1", path = "../orange-collection" }
orange-playlist = { version = "3.1.0-alpha.1", path = "../orange-playlist" }
orange-smartplaylists = { version = "3.1.0-alpha.1", path = "../orange-smartplaylists" }
orange-media = { version = "3.1.0-alpha.1", path = "../orange-media" }
orange-theme = { version = "3.1.0-alpha.1", path = "../orange-theme" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "desktop"], optional = true }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"], optional = true }
open = { version = "5", optional = true }
png = {version="0.18",optional=true}

[features]
default = ["full"]
# One Dioxus Desktop frontend on Windows, macOS, and Linux.
desktop = ["dep:png", "dep:dioxus", "dep:rfd", "dep:open", "dep:tokio"]
ui = ["desktop"]
online = ["orange-media/online"]
ui-qa = ["desktop"]
# Session-bus remote control: MPRIS2 server/client + serve/headless daemon.
dbus = ["dep:zbus", "dep:tokio", "orange-media/dbus"]
# Native desktop notifications (track changes, sync reports).
notify = ["dep:notify-rust"]
# Real audio output via GStreamer (UI transport and `orange --serve`).
gst = ["orange-media/gst"]
# Tag reading while scanning a collection folder.
tags = ["orange-media/tags"]
# Everything the Flatpak and `just test-full` enable.
full = [
    "ui",
    "online",
    "dbus",
    "notify",
    "gst",
    "tags",
    "orange-media/full",
]

[dependencies.zbus]
version = "5"
optional = true
default-features = false
features = ["tokio"]

[dependencies.tokio]
version = "1"
optional = true
features = ["rt", "time", "sync", "macros"]

[dependencies.notify-rust]
version = "4"
optional = true
default-features = false
features = ["z-with-tokio"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
