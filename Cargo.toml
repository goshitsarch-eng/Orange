[workspace]
members = [
  "crates/orange-core",
  "crates/orange-db",
  "crates/orange-collection",
  "crates/orange-playlist",
  "crates/orange-smartplaylists",
  "crates/orange-media",
  "crates/orange-theme",
  "crates/orange-app",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
homepage = "https://github.com/goshitsarch-eng/Orange"

# Shared house rule (mirrors gosh-flatpak-manager / gosh-net-radio):
# default builds and `cargo test` use only crates.io dependencies so they work
# offline and without system SDKs. The full COSMIC UI (`ui`) and real audio
# output (`gst`) are opt-in features, always enabled in the Flatpak manifest
# and CI. Nothing here depends on Qt: `cargo run` launches with no Qt installed.
