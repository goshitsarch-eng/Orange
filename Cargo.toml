[workspace]
members = [
  "crates/orange-core",
  "crates/orange-db",
  "crates/orange-collection",
  "crates/orange-playlist",
  "crates/orange-smartplaylists",
  "crates/orange-media",
  "crates/orange-theme",
  "crates/orange-app",
]
exclude = ["vendor/glib"]
resolver = "2"

[workspace.package]
version = "3.1.0-alpha.1"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
homepage = "https://github.com/goshitsarch-eng/Orange"

# Canonical desktop UI: Dioxus Desktop. Domain tests can use --no-default-features.

# Backport the upstream VariantStrIter safety fix required by GTK 3 bindings.
[patch.crates-io]
glib = {path="vendor/glib"}
